<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Sistem Monitoring Penerjemah</title>
  <link rel="icon" type="image/webp" href="/assets/favicon.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }

    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px -10px rgba(236, 72, 153, 0.15), 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #fce7f3;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fce7f3, #fdf2f8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      border: 2px solid #fbcfe8;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: #ec4899;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
      font-family: 'Quicksand', sans-serif;
    }

    p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fef2f2;
      color: #dc2626;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid #fecaca;
      margin-bottom: 1.75rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: white;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer-text {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Tidak Ada Koneksi
    </div>

    <h1>Anda Sedang Offline</h1>
    <p>
      Perangkat Anda tidak terhubung ke internet saat ini. Pastikan koneksi Wi-Fi atau data seluler Anda aktif, lalu
      coba muat ulang halaman.
    </p>

    <a href="/" class="btn" onclick="window.location.reload(); return false;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Coba Lagi
    </a>

    <p class="footer-text">Master Translate · Sistem Monitoring Penerjemah</p>
  </div>
</body>

</html>
